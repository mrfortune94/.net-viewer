name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      id: setup-java
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install Gradle (provide gradle if wrapper missing)
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.5'

    - name: Ensure Gradle wrapper exists and commit it (if missing)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        if [ ! -x "./gradlew" ]; then
          echo "Gradle wrapper not found — generating wrapper (Gradle 8.5)..."
          gradle wrapper --gradle-version 8.5 --no-daemon
          ls -la gradle/wrapper || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper || true
          if git diff --staged --quiet; then
            echo "No wrapper changes to commit"
          else
            git commit -m "chore(ci): add Gradle wrapper [skip ci]"
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
            git push origin HEAD:main
            echo "Committed Gradle wrapper to repo (skipped CI)"
          fi
        else
          echo "Gradle wrapper already present"
        fi

    - name: Set up Android SDK (install required platforms/build-tools)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        arch: x86_64
        force-avd-creation: false

    - name: Accept Android SDK licenses and install components
      run: |
        set -e
        if [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        elif [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        else
          SDKMANAGER="$(which sdkmanager || true)"
        fi
        if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
        else
          echo "sdkmanager not found; some SDK components may be missing"
        fi

    - name: Generate debug keystore if missing
      run: |
        set -e
        KEYSTORE_PATH="$GITHUB_WORKSPACE/debug.keystore"
        if [ ! -f "$KEYSTORE_PATH" ]; then
          echo "Generating debug keystore at $KEYSTORE_PATH"
          keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -storepass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        else
          echo "debug.keystore already exists"
        fi

    - name: Build APK
      run: |
        set -e
        if [ -x "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon
        else
          gradle :app:assembleDebug --no-daemon
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
