name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      id: setup-java
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install Gradle (if no wrapper)
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.5'

    - name: Set up Android SDK (install required platforms/build-tools)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        arch: x86_64
        force-avd-creation: false

    - name: Accept Android SDK licenses and install components
      run: |
        set -e
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        if [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        elif [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        else
          SDKMANAGER="$(which sdkmanager || true)"
        fi
        if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
        else
          echo "sdkmanager not found; some SDK components may be missing"
        fi

    - name: Build APK
      run: |
        set -e
        if [ -x "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon
        else
          gradle :app:assembleDebug --no-daemon
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
